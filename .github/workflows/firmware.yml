name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags are needed for `git describe`

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Version
        run: |
          V=$(git describe --tags --match 'v[0-9]*' --always --dirty)
          case "$V" in v*) V=${V#v} ;; *) V="0.0.0-g$V" ;; esac
          echo "FW_VERSION=$V" >> "$GITHUB_ENV"
          echo "Firmware version: $V" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: pio run -e esp32dev

      - name: Package
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
        run: |
          if [ -n "$FW_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$FW_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
            scripts/package.sh dist "$RUNNER_TEMP/key.pem"
            rm -f "$RUNNER_TEMP/key.pem"
            openssl dgst -sha256 -verify keys/fw-signing-pub.pem -signature dist/firmware.sig dist/firmware.bin
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "::error::Secret FW_SIGNING_KEY is not set: release firmware must be signed for internet updates"
            exit 1
          else
            scripts/package.sh dist
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: thermohub-${{ env.FW_VERSION }}
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ThermoHub ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/firmware.bin
            dist/firmware.sig
            dist/factory.bin
            dist/SHA256SUMS
