<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif">
<rect width="960" height="760" fill="#fff"/>
<text x="40" y="42" font-size="22" font-weight="600" fill="#222">Підключення 4×DS18B20 до ESP32 по 1-Wire</text>
<text x="40" y="66" font-size="14" fill="#666">Одна спільна шина, звичайне (не паразитне) живлення 3.3 В, один підтягувальний резистор</text>
<rect x="40" y="96" width="170" height="244" rx="10" fill="#eef3fb" stroke="#4a6fa5" stroke-width="2"/>
<text x="60" y="124" font-size="18" font-weight="600" fill="#1f3b63">ESP32</text>
<text x="60" y="324" font-size="12" fill="#666">WROOM-32</text>
<text x="196" y="155" font-size="15" font-weight="600" text-anchor="end" fill="#d32f2f">3V3</text>
<circle cx="210" cy="150" r="4" fill="#d32f2f"/>
<text x="196" y="225" font-size="15" font-weight="600" text-anchor="end" fill="#e0a100">GPIO4</text>
<circle cx="210" cy="220" r="4" fill="#e0a100"/>
<text x="196" y="295" font-size="15" font-weight="600" text-anchor="end" fill="#222">GND</text>
<circle cx="210" cy="290" r="4" fill="#222"/>
<text x="60" y="244" font-size="11" fill="#666">(пін змінюється</text>
<text x="60" y="258" font-size="11" fill="#666">в адмінці)</text>
<line x1="210" y1="150" x2="910" y2="150" stroke="#d32f2f" stroke-width="4" stroke-linecap="round"/>
<text x="910" y="140" font-size="13" text-anchor="end" fill="#d32f2f" font-weight="600">VDD  +3.3 В</text>
<line x1="210" y1="220" x2="910" y2="220" stroke="#e0a100" stroke-width="4" stroke-linecap="round"/>
<text x="910" y="210" font-size="13" text-anchor="end" fill="#e0a100" font-weight="600">DATA (DQ)</text>
<line x1="210" y1="290" x2="910" y2="290" stroke="#222" stroke-width="4" stroke-linecap="round"/>
<text x="910" y="280" font-size="13" text-anchor="end" fill="#222" font-weight="600">GND</text>
<line x1="270" y1="150" x2="270" y2="162" stroke="#222" stroke-width="2"/>
<rect x="261" y="162" width="18" height="46" fill="#fff6e0" stroke="#222" stroke-width="2"/>
<line x1="270" y1="208" x2="270" y2="220" stroke="#222" stroke-width="2"/>
<circle cx="270" cy="150" r="5" fill="#222"/>
<circle cx="270" cy="220" r="5" fill="#222"/>
<text x="286" y="182" font-size="15" font-weight="700" fill="#222">4.7 кОм</text>
<text x="286" y="200" font-size="12" fill="#666">один на всю шину</text>
<line x1="402" y1="370" x2="402" y2="290" stroke="#222" stroke-width="2.5"/>
<circle cx="402" cy="290" r="5" fill="#222"/>
<line x1="430" y1="370" x2="430" y2="220" stroke="#e0a100" stroke-width="2.5"/>
<circle cx="430" cy="220" r="5" fill="#e0a100"/>
<line x1="458" y1="370" x2="458" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
<circle cx="458" cy="150" r="5" fill="#d32f2f"/>
<path d="M386,370 H474 V400 A44,32 0 0 1 386,400 Z" fill="#2b2b2b" stroke="#000"/>
<text x="430" y="394" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">DS18B20</text>
<text x="430" y="416" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">T1</text>
<text x="402" y="450" font-size="11" text-anchor="middle" fill="#666">1</text>
<text x="430" y="450" font-size="11" text-anchor="middle" fill="#666">2</text>
<text x="458" y="450" font-size="11" text-anchor="middle" fill="#666">3</text>
<line x1="532" y1="370" x2="532" y2="290" stroke="#222" stroke-width="2.5"/>
<circle cx="532" cy="290" r="5" fill="#222"/>
<line x1="560" y1="370" x2="560" y2="220" stroke="#e0a100" stroke-width="2.5"/>
<circle cx="560" cy="220" r="5" fill="#e0a100"/>
<line x1="588" y1="370" x2="588" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
<circle cx="588" cy="150" r="5" fill="#d32f2f"/>
<path d="M516,370 H604 V400 A44,32 0 0 1 516,400 Z" fill="#2b2b2b" stroke="#000"/>
<text x="560" y="394" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">DS18B20</text>
<text x="560" y="416" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">T2</text>
<text x="532" y="450" font-size="11" text-anchor="middle" fill="#666">1</text>
<text x="560" y="450" font-size="11" text-anchor="middle" fill="#666">2</text>
<text x="588" y="450" font-size="11" text-anchor="middle" fill="#666">3</text>
<line x1="662" y1="370" x2="662" y2="290" stroke="#222" stroke-width="2.5"/>
<circle cx="662" cy="290" r="5" fill="#222"/>
<line x1="690" y1="370" x2="690" y2="220" stroke="#e0a100" stroke-width="2.5"/>
<circle cx="690" cy="220" r="5" fill="#e0a100"/>
<line x1="718" y1="370" x2="718" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
<circle cx="718" cy="150" r="5" fill="#d32f2f"/>
<path d="M646,370 H734 V400 A44,32 0 0 1 646,400 Z" fill="#2b2b2b" stroke="#000"/>
<text x="690" y="394" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">DS18B20</text>
<text x="690" y="416" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">T3</text>
<text x="662" y="450" font-size="11" text-anchor="middle" fill="#666">1</text>
<text x="690" y="450" font-size="11" text-anchor="middle" fill="#666">2</text>
<text x="718" y="450" font-size="11" text-anchor="middle" fill="#666">3</text>
<line x1="792" y1="370" x2="792" y2="290" stroke="#222" stroke-width="2.5"/>
<circle cx="792" cy="290" r="5" fill="#222"/>
<line x1="820" y1="370" x2="820" y2="220" stroke="#e0a100" stroke-width="2.5"/>
<circle cx="820" cy="220" r="5" fill="#e0a100"/>
<line x1="848" y1="370" x2="848" y2="150" stroke="#d32f2f" stroke-width="2.5"/>
<circle cx="848" cy="150" r="5" fill="#d32f2f"/>
<path d="M776,370 H864 V400 A44,32 0 0 1 776,400 Z" fill="#2b2b2b" stroke="#000"/>
<text x="820" y="394" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">DS18B20</text>
<text x="820" y="416" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">T4</text>
<text x="792" y="450" font-size="11" text-anchor="middle" fill="#666">1</text>
<text x="820" y="450" font-size="11" text-anchor="middle" fill="#666">2</text>
<text x="848" y="450" font-size="11" text-anchor="middle" fill="#666">3</text>
<text x="340" y="450" font-size="11" text-anchor="end" fill="#666">ніжки:</text>
<rect x="40" y="480" width="880" height="260" rx="10" fill="#fafafa" stroke="#ddd"/>
<text x="60" y="510" font-size="15" font-weight="600" fill="#222">Виводи та кольори проводів</text>
<text x="60" y="534" font-size="13" font-weight="600" fill="#222">Корпус TO-92 (пласкою стороною до себе, ніжки донизу): 1 — GND, 2 — DQ, 3 — VDD.</text>
<text x="60" y="554" font-size="13" font-weight="600" fill="#222">Датчик у гільзі з кабелем: червоний — VDD, чорний — GND, жовтий/білий — DATA.</text>
<text x="60" y="574" font-size="13" fill="#333">У частини дешевих кабелів кольори інші — звіртеся з описом або продзвоніть.</text>
<text x="60" y="598" font-size="15" font-weight="600" fill="#222">Поради</text>
<text x="60" y="622" font-size="13" fill="#333">• Живлення лише 3.3 В: лінія DATA підтягнута до живлення й іде прямо на GPIO ESP32 (не 5 В!).</text>
<text x="60" y="642" font-size="13" fill="#333">• Усі датчики паралельно на одній лінії («шина»); довгі відгалуження-«зірки» працюють гірше.</text>
<text x="60" y="662" font-size="13" fill="#333">• У кабелі використовуйте виту пару: DATA в парі з GND.</text>
<text x="60" y="682" font-size="13" fill="#333">• Кабелі довші за 10–15 м або збої читання — зменште підтяжку до 2.2 кОм;</text>
<text x="72" y="702" font-size="13" fill="#333">біля датчика можна поставити конденсатор 100 нФ між VDD і GND.</text>
<text x="60" y="722" font-size="13" fill="#333">• Порядок не важливий: датчики розрізняються за унікальною адресою, слот T1…T4 призначається в адмінці.</text>
</svg>