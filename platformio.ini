[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; 2 x 1.9MB app slots for web OTA
extra_scripts = pre:scripts/prebuild.py
build_flags =
  -DGH_REPO=\"set-st/esp32-thermo\"
  ; async web server runs on core 0, the main loop (sensors, LCD, encoder) on core 1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  marcoschwartz/LiquidCrystal_I2C@^1.1.4
  adafruit/Adafruit AHTX0@^2.0.5
  adafruit/Adafruit BMP280 Library@^2.6.8
  bblanchon/ArduinoJson@^7.2.0
  esp32async/AsyncTCP@^3.3.2
  esp32async/ESPAsyncWebServer@^3.6.0
